<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b0b0e"
    >

    <title>MotorFlex - Mensagens e Negociações</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="/imagens/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="../css/index.css"
    >

    <link
        rel="stylesheet"
        href="../css/mensagens.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body class="chat-page">

    <!-- ======================================
         CABEÇALHO PRINCIPAL
    ======================================= -->
    <header class="header">

        <nav class="navbar">

            <div class="logo">
                <a
                    href="/pages/index.html"
                    class="nav-link"
                >
                    Motor<span>Flex</span>
                </a>
            </div>

            <a
                href="/pages/catalogo.html"
                id="btnVoltar"
                class="nav-back-btn"
            >
                <i class="fa-solid fa-arrow-left"></i>

                <span id="btnVoltarTexto">
                    Voltar
                </span>
            </a>

        </nav>

    </header>

    <!-- ======================================
         CONTEÚDO DO CHAT
    ======================================= -->
    <main class="container chat-main-container">

        <div
            class="chat-wrapper"
            id="chatWrapper"
        >

            <!-- ==================================
                 BARRA LATERAL
            =================================== -->
            <aside
                class="chat-sidebar"
                aria-label="Conversas"
            >

                <div class="chat-sidebar-header">

                    <h2>Conversas</h2>

                    <span
                        class="chat-badge-count"
                        id="totalConversas"
                    >
                        0
                    </span>

                </div>

                <!-- CHAT GLOBAL -->
                <button
                    type="button"
                    class="conversa-global-item"
                    id="btnChatGlobal"
                    aria-label="Abrir Chat Global"
                >

                    <span class="global-avatar">
                        <i class="fa-solid fa-earth-americas"></i>
                    </span>

                    <span class="global-info">

                        <strong>
                            Chat Global
                        </strong>

                        <small id="globalStatusTexto">
                            Conectando...
                        </small>

                    </span>

                    <span
                        class="global-status"
                        title="Usuários online"
                    >

                        <span
                            class="global-status-dot"
                            id="globalStatusDot"
                        ></span>

                        <span id="globalOnlineCount">
                            0
                        </span>

                    </span>

                </button>

                <!-- PESQUISA DE CONVERSAS PRIVADAS -->
                <div class="chat-search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="search"
                        id="inputPesquisaConversa"
                        placeholder="Pesquisar por nome ou veículo"
                        autocomplete="off"
                    >

                </div>

                <!-- FILTROS -->
                <div
                    class="chat-filtros"
                    role="tablist"
                    aria-label="Filtros de conversas"
                >

                    <button
                        type="button"
                        class="filtro ativo"
                        data-filtro="todas"
                        role="tab"
                    >
                        Todas
                    </button>

                    <button
                        type="button"
                        class="filtro"
                        data-filtro="nao-lidas"
                        role="tab"
                    >
                        Não lidas

                        <span
                            id="totalNaoLidas"
                            hidden
                        >
                            0
                        </span>
                    </button>

                </div>

                <!-- LISTA DE CONVERSAS PRIVADAS -->
                <div
                    class="conversas-list"
                    id="conversasList"
                >
                    <div class="chat-loading">
                        Carregando conversas...
                    </div>
                </div>

            </aside>

            <!-- ==================================
                 ÁREA DA CONVERSA ATIVA
            =================================== -->
            <section
                class="chat-content-area"
                id="chatContentArea"
            >

                <!-- ESTADO INICIAL -->
                <div
                    class="chat-empty-state"
                    id="chatEmptyState"
                >

                    <div class="empty-icone">
                        <i class="fa-solid fa-comments"></i>
                    </div>

                    <h3>
                        Suas mensagens
                    </h3>

                    <p>
                        Selecione o Chat Global ou uma conversa
                        privada ao lado.
                    </p>

                </div>

                <!-- CHAT ABERTO -->
                <div
                    class="chat-active-box"
                    id="chatActiveBox"
                    hidden
                >

                    <!-- CABEÇALHO DO CHAT -->
                    <div class="chat-header-info">

                        <button
                            type="button"
                            class="btn-lista"
                            id="btnListaVoltar"
                            aria-label="Voltar para as conversas"
                        >
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>

                        <span
                            class="av av-md"
                            id="chatAvatar"
                        ></span>

                        <div class="chat-header-texto">

                            <h3 id="chatDestinatarioNome">
                                Nome do usuário
                            </h3>

                            <span
                                class="chat-veiculo-ref"
                                id="chatVeiculoRef"
                            >
                                <i class="fa-solid fa-car-side"></i>

                                Veículo em negociação
                            </span>

                        </div>

                    </div>

                    <!-- MENSAGENS -->
                    <div class="chat-messages-wrap">

                        <div
                            class="chat-messages-scroll"
                            id="chatMessagesScroll"
                            aria-live="polite"
                            aria-label="Mensagens"
                        ></div>

                        <button
                            type="button"
                            class="btn-baixo"
                            id="btnBaixo"
                            aria-label="Ir para as mensagens mais recentes"
                            hidden
                        >
                            <i class="fa-solid fa-chevron-down"></i>

                            <span
                                id="baixoContador"
                                hidden
                            >
                                0
                            </span>
                        </button>

                    </div>

                    <!-- RESPOSTAS RÁPIDAS -->
                    <div
                        class="respostas-rapidas"
                        id="respostasRapidas"
                        hidden
                    ></div>

                    <!-- EMOJIS -->
                    <div
                        class="emoji-panel"
                        id="emojiPanel"
                        hidden
                    ></div>

                    <!-- ENVIO DE MENSAGEM -->
                    <form
                        class="chat-input-form"
                        id="chatForm"
                        autocomplete="off"
                    >

                        <button
                            type="button"
                            class="btn-icone"
                            id="btnRapidas"
                            aria-label="Respostas rápidas"
                            title="Respostas rápidas"
                        >
                            <i class="fa-solid fa-bolt"></i>
                        </button>

                        <button
                            type="button"
                            class="btn-icone"
                            id="btnEmoji"
                            aria-label="Emojis"
                            title="Emojis"
                        >
                            <i class="fa-regular fa-face-smile"></i>
                        </button>

                        <textarea
                            id="inputMensagem"
                            rows="1"
                            maxlength="1000"
                            placeholder="Escreva sua mensagem..."
                            aria-label="Mensagem"
                        ></textarea>

                        <button
                            type="submit"
                            id="btnEnviarMensagem"
                            class="btn-enviar"
                            aria-label="Enviar mensagem"
                            disabled
                        >
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>

                    </form>

                    <!-- RETORNO DE ERROS DO CHAT -->
                    <div
                        class="chat-feedback"
                        id="chatFeedback"
                        role="status"
                        aria-live="polite"
                    ></div>

                </div>

            </section>

        </div>

    </main>

    <!-- ======================================
         MODAL PARA APAGAR MENSAGEM PRIVADA
    ======================================= -->
    <div
        class="modal-delete-overlay"
        id="modalDeleteMsg"
        hidden
    >

        <div class="modal-delete-card wa-style">

            <h3 id="modalDeleteTitulo">
                Apagar mensagem?
            </h3>

            <p id="modalDeleteTexto">
                Você pode apagar esta mensagem apenas para você
                ou para todos nesta conversa.
            </p>

            <div class="modal-delete-acoes wa-acoes">

                <button
                    type="button"
                    class="btn-wa btn-para-todos"
                    id="btnDeleteParaTodos"
                >
                    Apagar para todos
                </button>

                <button
                    type="button"
                    class="btn-wa btn-para-mim"
                    id="btnDeleteParaMim"
                >
                    Apagar para mim
                </button>

                <button
                    type="button"
                    class="btn-wa btn-cancelar"
                    id="btnDeleteCancelar"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </div>

    <!-- AVISOS -->
    <div
        class="toast-area"
        id="toastArea"
        aria-live="polite"
    ></div>

    <!-- Socket.IO precisa carregar antes do mensagens.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/mensagens.js"></script>

</body>

</html>
