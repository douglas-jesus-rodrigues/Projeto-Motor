<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Segurança: só carrega scripts/estilos do próprio site; imagens do site ou https -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#08080a">
    <title>Meus Favoritos | MotorFlex</title>

    <link rel="icon" href="/imagens/favicon.ico">
    <link rel="stylesheet" href="/css/favoritos.css">
</head>
<body>

    <!-- Ícones (sprite local, sem dependência externa) -->
    <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.8-4.7-9.6-9.6C1.2 7.6 3.3 4.5 6.7 4.5c2 0 3.5 1 5.3 3 1.8-2 3.3-3 5.3-3 3.4 0 5.5 3.1 4.3 6.4-1.8 4.9-9.6 9.6-9.6 9.6z"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l.9 12.5h9.2L17.5 7"/><path d="M10 11v5M14 11v5"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
        <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13l3.5-4"/><circle cx="12" cy="13.5" r="1"/></symbol>
        <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16.5v-5l1.8-4.5h10.4L19 11.5v5"/><path d="M3.5 16.5h17"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4L2.8 19.5h18.4L12 4z"/><path d="M12 10v4.5M12 17.2v.3"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 11A7.5 7.5 0 1 0 18 16"/><path d="M19.5 5v6h-6"/></symbol>
    </svg>

    <a class="pular" href="#conteudo">Pular para o conteúdo</a>

    <!-- Cabeçalho -->
    <header class="header">
        <a class="logo" href="/pages/index.html" aria-label="MotorFlex - início"><h1>Motor<span>Flex</span></h1></a>
        <nav class="nav-menu" aria-label="Navegação">
            <a href="/pages/painel-cliente.html" id="voltar" class="nav-link">
                <svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg>
                <span id="voltarTexto">Voltar ao Painel</span>
            </a>
            <a href="/pages/catalogo.html" class="nav-link nav-link--sec">Catálogo</a>
        </nav>
    </header>

    <main class="container" id="conteudo">

        <!-- Título + resumo -->
        <section class="hero">
            <div class="hero__texto">
                <h2><svg class="ic ic--fill" aria-hidden="true"><use href="#i-heart"/></svg> Veículos Favoritos</h2>
                <p>Aqui estão os carros que você salvou para acompanhar e conferir depois.</p>
            </div>
            <ul class="stats" id="stats" hidden>
                <li class="stat"><strong id="statTotal">0</strong><span id="statTotalLabel">veículos</span></li>
                <li class="stat"><strong id="statMin">—</strong><span>a partir de</span></li>
                <li class="stat"><strong id="statMedia">—</strong><span>preço médio</span></li>
            </ul>
        </section>

        <!-- Aviso: favoritos que não existem mais no sistema -->
        <div class="aviso" id="aviso" role="status" hidden>
            <svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>
            <p id="avisoTexto"></p>
            <button type="button" class="btn btn--ghost btn--sm" id="btnLimparIndisponiveis">Remover da lista</button>
        </div>

        <!-- Ferramentas -->
        <section class="toolbar" id="toolbar" aria-label="Filtros" hidden>
            <label class="busca">
                <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
                <span class="sr-only">Buscar nos favoritos</span>
                <input type="search" id="busca" placeholder="Buscar por marca, modelo ou versão…" autocomplete="off" maxlength="60">
            </label>
            <select id="filtroMarca" aria-label="Filtrar por marca"></select>
            <select id="ordem" aria-label="Ordenar favoritos">
                <option value="recentes">Adicionados recentemente</option>
                <option value="menor">Menor preço</option>
                <option value="maior">Maior preço</option>
                <option value="novos">Mais novos</option>
                <option value="km">Menor quilometragem</option>
                <option value="nome">Nome (A–Z)</option>
            </select>
            <button type="button" class="btn btn--ghost" id="btnLimparFiltros" hidden>Limpar filtros</button>
            <button type="button" class="btn btn--perigo" id="btnLimparTudo">
                <svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg> Limpar favoritos
            </button>
        </section>

        <p class="resultado" id="resultado" aria-live="polite"></p>

        <!-- Cards injetados pelo JS -->
        <section class="grid-veiculos" id="gridFavoritos" aria-busy="true" aria-label="Lista de favoritos">
            <noscript><p class="estado">Ative o JavaScript para ver seus favoritos.</p></noscript>
        </section>
    </main>

    <!-- Avisos (com "Desfazer") -->
    <div class="toast-area" id="toastArea" role="status" aria-live="polite"></div>

    <!-- Confirmação -->
    <div class="modal-overlay" id="modalConfirma" hidden>
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmaTitulo" aria-describedby="confirmaTexto">
            <div class="modal__icone"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg></div>
            <h3 id="confirmaTitulo">Confirmar</h3>
            <p id="confirmaTexto"></p>
            <div class="modal__botoes">
                <button type="button" class="btn btn--cinza" id="confirmaCancelar">Cancelar</button>
                <button type="button" class="btn btn--primario" id="confirmaOk">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="/js/favoritos.js"></script>
</body>
</html>
