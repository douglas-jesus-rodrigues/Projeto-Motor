<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anunciar Veículo | MotorFlex</title>

    <link rel="icon" type="image/x-icon" href="/imagens/favicon.ico">
    <link rel="stylesheet" href="/css/anunciar.css">
</head>
<body>

<header class="header">
    <nav class="navbar">
        <h1 class="logo">
            <a href="/pages/index.html">Motor<span>Flex</span></a>
        </h1>

        <a href="#" class="btn-voltar" id="btnPainel">Meu Painel</a>
    </nav>
</header>

<main class="container">
    <section class="card-anuncio">

        <div class="topo">
            <h2>Anunciar veículo</h2>
            <p>Preencha os dados abaixo para cadastrar seu carro no sistema.</p>
        </div>

        <form id="formAnuncio" enctype="multipart/form-data">

            <div class="form-grid">

                <div class="grupo">
                    <label for="marca">Marca *</label>
                    <input type="text" id="marca" name="marca" placeholder="Ex: Honda" required>
                    <small id="erroMarca" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="modelo">Modelo *</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Ex: Civic" required>
                    <small id="erroModelo" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="versao">Versão</label>
                    <input type="text" id="versao" name="versao" placeholder="Ex: EXL 2.0">
                </div>

                <div class="grupo">
                    <label for="anoFabricacao">Ano fabricação *</label>
                    <input type="number" id="anoFabricacao" name="ano_fabricacao" placeholder="Ex: 2021" min="1900" max="2030" required>
                    <small id="erroAnoFabricacao" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="anoModelo">Ano modelo *</label>
                    <input type="number" id="anoModelo" name="ano_modelo" placeholder="Ex: 2022" min="1900" max="2030" required>
                    <small id="erroAnoModelo" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="preco">Preço (R$) *</label>
                    <input type="number" id="preco" name="preco" placeholder="Ex: 98000" step="0.01" min="0" required>
                    <small id="erroPreco" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="quilometragem">Quilometragem (Km)</label>
                    <input type="number" id="quilometragem" name="quilometragem" placeholder="Ex: 45000" min="0">
                </div>

                <div class="grupo">
                    <label for="combustivel">Combustível</label>
                    <select id="combustivel" name="combustivel">
                        <option value="flex">Flex</option>
                        <option value="gasolina">Gasolina</option>
                        <option value="etanol">Etanol</option>
                        <option value="diesel">Diesel</option>
                        <option value="eletrico">Elétrico</option>
                        <option value="hibrido">Híbrido</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="cambio">Câmbio</label>
                    <select id="cambio" name="cambio">
                        <option value="manual">Manual</option>
                        <option value="automatico">Automático</option>
                        <option value="automatizado">Automatizado</option>
                        <option value="cvt">CVT</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="cor">Cor</label>
                    <input type="text" id="cor" name="cor" placeholder="Ex: Preto">
                </div>

                <div class="grupo">
                    <label for="portas">Portas</label>
                    <input type="number" id="portas" name="portas" placeholder="Ex: 4" min="2" max="6">
                </div>

                <div class="grupo">
                    <label for="carroceria">Carroceria</label>
                    <input type="text" id="carroceria" name="carroceria" placeholder="Ex: Sedan">
                </div>

                <div class="grupo grupo-full">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva detalhes importantes do veículo, opcionais e estado de conservação..."></textarea>
                </div>

                <div class="grupo grupo-full">
                    <label for="imagem">Foto Principal do Veículo</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </div>

            </div>

            <button type="submit" class="btn-anunciar" id="btnAnunciar">
                Publicar anúncio
            </button>

        </form>

    </section>
</main>

<script src="/js/anunciar.js"></script>
</body>
</html>
