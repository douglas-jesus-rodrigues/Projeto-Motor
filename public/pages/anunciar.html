<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anunciar Veículo | MotorFlex</title>

    <link rel="icon" type="image/x-icon" href="/imagens/favicon.ico">
    <link rel="stylesheet" href="/css/anunciar.css">
</head>
<body>

<header class="header">
    <nav class="navbar">
        <h1 class="logo">
            <a href="/pages/index.html">Motor<span>Flex</span></a>
        </h1>

        <a href="#" class="btn-voltar" id="btnPainel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Meu Painel
        </a>
    </nav>
</header>

<main class="container">
    <section class="card-anuncio">

        <div class="topo">
            <span class="badge-novo">Novo Anúncio</span>
            <h2>Cadastrar Veículo</h2>
            <p>Preencha as especificações técnicas e comerciais para expor seu veículo na vitrine da MotorFlex.</p>
        </div>

        <form id="formAnuncio" enctype="multipart/form-data">

            <div class="form-grid">

                <div class="grupo">
                    <label for="marca">Marca *</label>
                    <input type="text" id="marca" name="marca" placeholder="Ex: Honda" required>
                    <small id="erroMarca" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="modelo">Modelo *</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Ex: Civic" required>
                    <small id="erroModelo" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="versao">Versão</label>
                    <input type="text" id="versao" name="versao" placeholder="Ex: EXL 2.0">
                </div>

                <div class="grupo">
                    <label for="anoFabricacao">Ano fabricação *</label>
                    <input type="number" id="anoFabricacao" name="ano_fabricacao" placeholder="Ex: 2021" min="1900" max="2030" required>
                    <small id="erroAnoFabricacao" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="anoModelo">Ano modelo *</label>
                    <input type="number" id="anoModelo" name="ano_modelo" placeholder="Ex: 2022" min="1900" max="2030" required>
                    <small id="erroAnoModelo" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="preco">Preço (R$) *</label>
                    <div class="input-money-wrapper">
                        <span class="prefixo">R$</span>
                        <input type="number" id="preco" name="preco" placeholder="98.000" step="0.01" min="0" required>
                    </div>
                    <small id="erroPreco" class="erro-texto"></small>
                </div>

                <div class="grupo">
                    <label for="quilometragem">Quilometragem (Km)</label>
                    <input type="number" id="quilometragem" name="quilometragem" placeholder="Ex: 45000" min="0">
                </div>

                <div class="grupo">
                    <label for="combustivel">Combustível</label>
                    <select id="combustivel" name="combustivel">
                        <option value="flex">Flex</option>
                        <option value="gasolina">Gasolina</option>
                        <option value="etanol">Etanol</option>
                        <option value="diesel">Diesel</option>
                        <option value="eletrico">Elétrico</option>
                        <option value="hibrido">Híbrido</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="cambio">Câmbio</label>
                    <select id="cambio" name="cambio">
                        <option value="manual">Manual</option>
                        <option value="automatico">Automático</option>
                        <option value="automatizado">Automatizado</option>
                        <option value="cvt">CVT</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="cor">Cor</label>
                    <input type="text" id="cor" name="cor" placeholder="Ex: Preto Perolizado">
                </div>

                <div class="grupo">
                    <label for="portas">Portas</label>
                    <input type="number" id="portas" name="portas" placeholder="Ex: 4" min="2" max="6">
                </div>

                <div class="grupo">
                    <label for="carroceria">Carroceria</label>
                    <input type="text" id="carroceria" name="carroceria" placeholder="Ex: Sedan">
                </div>

                <div class="grupo grupo-full">
                    <label for="descricao">Descrição Detalhada</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva opcionais, revisões feitas, estado de conservação e diferenciais do veículo..."></textarea>
                </div>

                <div class="grupo grupo-full">
                    <label class="label-upload">Foto Principal do Veículo</label>
                    <label for="imagem" class="dropzone-file">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <span id="nomeArquivoSelecionado">Clique para escolher uma foto ou arraste até aqui</span>
                        <input type="file" id="imagem" name="imagem" accept="image/*" style="display: none;">
                    </label>
                </div>

            </div>

            <button type="submit" class="btn-anunciar" id="btnAnunciar">
                Publicar Anúncio Agora
            </button>

        </form>

    </section>
</main>

<script src="/js/anunciar.js"></script>
<script>
    // Atualiza o texto do dropzone quando o usuário seleciona um arquivo
    const inputImg = document.getElementById('imagem');
    const nomeArq = document.getElementById('nomeArquivoSelecionado');
    if(inputImg) {
        inputImg.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                nomeArq.textContent = `Arquivo selecionado: ${e.target.files[0].name}`;
                nomeArq.style.color = '#fff';
            }
        });
    }
</script>
</body>
</html>
