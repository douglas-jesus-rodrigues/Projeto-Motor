<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderação de Denúncias - MotorFlex</title>

    <link rel="shortcut icon" href="/imagens/favicon.ico" type="image/x-icon">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/moderacao.css">
</head>
<body>

    <!-- Cabeçalho do Admin -->
    <header class="header">
        <div class="logo">
            <h1>Motor<span>Flex</span></h1>
        </div>
        <nav class="nav-menu" aria-label="Navegação principal">
            <a href="/pages/painel-admin.html"><i class="bi bi-arrow-left"></i> Voltar</a>
            <a href="/pages/catalogo.html"><i class="bi bi-car-front"></i> Catálogo</a>
        </nav>
    </header>

    <!-- Container Principal -->
    <main class="container">
        
        <section class="boas-vindas">
            <h2><i class="bi bi-exclamation-triangle-fill"></i> Central de Denúncias</h2>
            <p>Examine os anúncios reportados pelos usuários. Se a denúncia for procedente e violar as regras, remova o veículo do catálogo ativo.</p>
        </section>

        <!-- Grid de Denúncias (Renderizado dinamicamente pelo JS) -->
        <section class="cards" id="listaDenuncias" aria-label="Lista de denúncias pendentes">
            <!-- O JS insere os cards aqui -->
        </section>

        <!-- Navegação da Paginação -->
        <div class="paginacao" id="paginacaoContainer">
            <button id="btnPagAnterior" class="btn-pag" disabled>
                <i class="bi bi-chevron-left"></i> Anterior
            </button>
            <span id="infoPagina" class="info-pagina">Página 1</span>
            <button id="btnPagProxima" class="btn-pag">
                Próxima <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </main>

    <script src="/js/moderacao.js"></script>
</body>
</html>
