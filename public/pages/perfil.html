<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | MotorFlex</title>
    <link rel="icon" href="/imagens/favicon.ico">
    <link rel="stylesheet" href="/css/perfil.css">
</head>
<body>

    <!-- Cabeçalho Dinâmico -->
    <header class="header">
        <div class="logo">
            <h1>Motor<span>Flex</span></h1>
        </div>
        <nav class="nav-menu">
            <!-- Botão Voltar Nativo em SVG -->
            <a href="#" id="btnVoltar">
                <svg xmlns="http://w3.org" viewBox="0 0 448 512" width="14" height="14" fill="currentColor" style="margin-right: 4px;">
                    <path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32L109.3 224 214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/>
                </svg> 
                Voltar
            </a>
        </nav>
    </header>

    <main class="container">
        <!-- Seção de Cabeçalho do Perfil -->
        <section class="boas-vindas">
            <h2>
                <svg xmlns="http://w3.org" viewBox="0 0 640 512" width="22" height="22" fill="var(--primary)" style="margin-right: 8px; vertical-align: middle;">
                    <path d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 363.8 0 459.4C0 488.4 23.6 512 52.6 512l342.8 0c29 0 52.6-23.6 52.6-52.6c0-95.6-79.8-155.4-178.3-155.4l-91.4 0zM576 224l-32 0c-8.8 0-16-7.2-16-16s7.2-16 16-16l32 0c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 96l-32 0c-8.8 0-16-7.2-16-16s7.2-16 16-16l32 0c8.8 0 16 7.2 16 16s-7.2 16-16 16zm-16 80c8.8 0 16 7.2 16 16s-7.2 16-16 16l-32 0c-8.8 0-16-7.2-16-16s7.2-16 16-16l32 0zm-112-96c-8.8 0-16-7.2-16-16s7.2-16 16-16l32 0c8.8 0 16 7.2 16 16s-7.2 16-16 16l-32 0zm0-96c-8.8 0-16-7.2-16-16s7.2-16 16-16l32 0c8.8 0 16 7.2 16 16s-7.2 16-16 16l-32 0zm0-96c-8.8 0-16-7.2-16-16s7.2-16 16-16l32 0c8.8 0 16 7.2 16 16s-7.2 16-16 16l-32 0z"/>
                </svg>
                Minhas Informações
            </h2>
            <p>Visualize e gerencie os dados de cadastro da sua conta na plataforma.</p>
        </section>

        <!-- Formulário / Bloco de Informações -->
        <div class="perfil-wrapper">
            <form id="formPerfil" class="perfil-form">
                
                <!-- Badge de Tipo de Conta -->
                <div class="tipo-conta-container">
                    <span id="badgeTipoConta" class="badge">Carregando tipo de conta...</span>
                </div>

                <!-- SEÇÃO 1: DADOS PESSOAIS -->
                <div class="form-secao">
                    <h3>Dados Pessoais</h3>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" readonly>
                        </div>

                        <div class="form-group">
                            <label for="sobrenome">Sobrenome</label>
                            <input type="text" id="sobrenome" readonly>
                        </div>

                        <!-- E-mail com botão de texto nativo -->
                        <div class="form-group la-inteira">
                            <label for="email">E-mail</label>
                            <div class="input-com-botao">
                                <input type="email" id="email" readonly>
                                <button type="button" class="btn-revelar" data-alvo="email">Ver</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" readonly>
                        </div>

                        <!-- CPF com botão de texto nativo -->
                        <div class="form-group">
                            <label for="cpf">CPF</label>
                            <div class="input-com-botao">
                                <input type="text" id="cpf" readonly>
                                <button type="button" class="btn-revelar" data-alvo="cpf">Ver</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SEÇÃO 2: DADOS DA EMPRESA -->
                <div class="form-secao" id="secaoEmpresa" style="display: none;">
                    <h3>Dados Corporativos</h3>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj" readonly>
                        </div>

                        <div class="form-group">
                            <label for="nomeEmpresa">Nome da Empresa</label>
                            <input type="text" id="nomeEmpresa" readonly>
                        </div>

                        <div class="form-group">
                            <label for="razaoSocial">Razão Social</label>
                            <input type="text" id="razaoSocial" readonly>
                        </div>

                        <div class="form-group">
                            <label for="inscricaoEstadual">Inscrição Estadual</label>
                            <input type="text" id="inscricaoEstadual" readonly>
                        </div>

                        <div class="form-group la-inteira">
                            <label for="site">Website</label>
                            <input type="url" id="site" readonly>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <script src="/js/perfil.js"></script>
</body>
</html>
