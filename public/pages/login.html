<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFlex | Portal de Acesso</title>

    <meta name="description" content="Acesse a plataforma MotorFlex - Gestão e Performance Automotiva.">
    <meta name="theme-color" content="#000000">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../imagens/favicon.ico">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="../css/login.css">
    
    <!-- Fonte Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fundo: Dodge Challenger -->
    <div class="bg-image-overlay" aria-hidden="true"></div>

    <!-- Camada de Nuvem 1 (Fundo/Intermediária) -->
    <div class="neblina-layer neblina-fundo" aria-hidden="true"></div>

    <!-- Mensagem de Toast/Notificação -->
    <div id="mensagem" class="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <!-- Botão para voltar -->
    <a href="../pages/index.html" class="btn-voltar" aria-label="Voltar para a página inicial">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>INÍCIO</span>
    </a>

    <!-- Container da Caixa de Login -->
    <main class="login-wrapper">
        <section class="login-card">
            <header class="card-header">
                <h1>MOTOR<span>FLEX</span></h1>
                <p>Acesse sua conta para continuar</p>
            </header>

            <form id="formLogin" method="POST" novalidate>
                <!-- Campo E-mail -->
                <div class="input-group" id="group-email">
                    <label for="email">E-mail</label>
                    <div class="input-container">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="seuemail@exemplo.com" 
                            required 
                            autocomplete="email"
                            spellcheck="false"
                        >
                    </div>
                    <span class="erro-texto" id="erro-email"></span>
                </div>

                <!-- Campo Senha -->
                <div class="input-group" id="group-senha">
                    <div class="label-container">
                        <label for="senha">Senha</label>
                        <a href="../pages/esqueci-senha.html" class="link-esqueci">Esqueceu a senha?</a>
                    </div>
                    <div class="input-container senha-container">
                        <input 
                            type="password" 
                            id="senha" 
                            name="senha" 
                            placeholder="••••••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            id="verSenha" 
                            class="btn-toggle-senha" 
                            aria-label="Mostrar ou ocultar senha"
                        >
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="erro-texto" id="erro-senha"></span>
                </div>

                <!-- Botão de Login -->
                <button type="submit" id="btnSubmit" class="btn-submit">
                    <span class="btn-label">ENTRAR</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>

                <!-- Rodapé -->
                <footer class="card-footer">
                    <p>Ainda não tem conta? <a href="../pages/cadastro.html">Cadastre-se</a></p>
                </footer>
            </form>
        </section>
    </main>

    <!-- Camada de Nuvem 2 (Frontal - Passa por cima da tela trazendo efeito volumétrico) -->
    <div class="neblina-layer neblina-frente" aria-hidden="true"></div>

    <script src="../js/login.js"></script>
</body>
</html>
