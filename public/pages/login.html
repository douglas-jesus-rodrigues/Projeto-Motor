<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFlex | Login</title>

    <link rel="icon" type="image/x-icon" href="/imagens/favicon.ico">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div id="mensagem"></div>

    <a href="/pages/index.html" class="btn-voltar-topo">
    ← Início
</a>

    <main class="login-container">
        <section class="login-card">
            <h1>Motor<span>Flex</span></h1>
            <p>Acesse sua conta</p>

            <form id="formLogin">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <div class="senha-area">
                        <input type="password" id="senha" placeholder="Digite sua senha">
                        <button type="button" id="verSenha">Ver</button>
                    </div>
                </div>
                
                <div class="esqueci-senha">
                    <a href="/pages/esqueci-senha.html">
                        Esqueci minha senha
                    </a>
                </div>




                <button type="submit" class="btn-login">Entrar</button>

                <p class="cadastro">
                    Não tem conta?
                    <a href="/pages/cadastro.html">Cadastre-se</a>
                </p>
            </form>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
