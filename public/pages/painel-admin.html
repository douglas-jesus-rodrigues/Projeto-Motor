<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | MotorFlex</title>

    <link rel="icon" href="/imagens/favicon.ico">
    <!-- Importação do Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/painel-admin.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <h1>Motor<span>Flex</span> <small style="color: #888; font-size: 0.9rem;">| Admin</small></h1>
        </div>

        <nav class="nav-menu">
            <a href="/pages/usuarios.html"><i class="fa-solid fa-users"></i> Usuários</a>
            <a href="/pages/moderacao.html"><i class="fa-solid fa-check-double"></i> Moderação</a>
            <a href="#" id="btnSair" class="sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
        </nav>
    </header>

    <main class="container">
        <section class="boas-vindas">
            <h2 id="nomeAdmin"><i class="fa-solid fa-shield-halved"></i> Painel Administrativo</h2>
            <p>Gerenciamento estratégico da plataforma, controle de usuários e moderação de anúncios.</p>
        </section>

        <section class="cards">
            <div class="card">
                <div class="card-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="card-content">
                    <h3>Usuários Cadastrados</h3>
                    <p id="totalUsuarios">Carregando...</p>
                    <a href="/pages/usuarios.html" class="btn-card">Gerenciar usuários <i class="fa-solid fa-arrow-right"></i></a>
                </div>
            </div>

            <div class="card">
                <div class="card-icon">
                    <i class="fa-solid fa-car"></i>
                </div>
                <div class="card-content">
                    <h3>Moderação de Anúncios</h3>
                    <p id="totalAnuncios">Carregando...</p>
                    <a href="/pages/moderacao.html" class="btn-card">Ver anúncios <i class="fa-solid fa-arrow-right"></i></a>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/painel-admin.js"></script>
</body>
</html>
